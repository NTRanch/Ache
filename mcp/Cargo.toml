[package]
name = "lovense-mcp"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Lovense MCP stdio server (stage S2: read core plus the decide()-gated output core)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
